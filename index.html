<style>
  :root {
    --green: #7cf03a;
    --green-dim: rgba(124, 240, 58, .45);
    --ink: #0c1608;
    --bone: #ecffe0;
    --soft: #aee196;
    --panel: rgba(10, 24, 8, .78);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: Inter, "Segoe UI", system-ui, sans-serif;
    color: var(--bone);
    background:
      radial-gradient(900px 520px at 50% -80px, rgba(124, 240, 58, .20), transparent 70%),
      radial-gradient(700px 700px at 50% 120%, rgba(124, 240, 58, .08), transparent 70%),
      #060d05;
  }
  .stripes {
    height: 14px;
    background: repeating-linear-gradient(-45deg, rgba(124, 240, 58, .35) 0 14px, transparent 14px 28px);
  }
  main {
    max-width: 470px;
    margin: 0 auto;
    padding: 36px 20px 28px;
    text-align: center;
  }
  .avatar {
    width: 112px; height: 112px;
    border-radius: 50%;
    border: 4px solid var(--green);
    box-shadow: 0 0 34px rgba(124, 240, 58, .55);
    display: block; margin: 0 auto 16px;
  }
  h1 {
    font-family: Anton, Impact, "Arial Narrow", sans-serif;
    font-weight: 400;
    font-size: 46px;
    letter-spacing: 1px;
    margin: 0;
    line-height: 1.05;
    text-shadow: 0 0 22px rgba(124, 240, 58, .6);
  }
  .tagline { margin: 6px 0 26px; color: var(--soft); font-weight: 600; font-size: 15px; }

  .feature {
    display: block; text-decoration: none; color: inherit;
    border: 2px solid var(--green); border-radius: 16px; overflow: hidden;
    background: var(--panel);
    box-shadow: 0 0 26px rgba(124, 240, 58, .22);
    margin-bottom: 18px;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .feature img { display: block; width: 100%; height: auto; }
  .feature .cap {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 16px; text-align: left;
  }
  .badge {
    font-size: 12px; font-weight: 700; color: var(--ink); background: var(--green);
    border-radius: 999px; padding: 3px 10px; margin-right: 8px;
  }
  .feature strong { font-size: 16px; }
  .feature small { display: block; color: var(--soft); margin-top: 3px; font-size: 13px; }

  .links { display: grid; gap: 12px; }
  .btn {
    display: flex; align-items: center; gap: 14px;
    min-height: 62px; padding: 0 18px;
    border: 2px solid var(--green-dim); border-radius: 14px;
    background: var(--panel);
    color: var(--bone); text-decoration: none; font-weight: 700; font-size: 16px;
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .btn svg { width: 26px; height: 26px; flex: none; fill: var(--green); }
  .btn span { flex: 1; text-align: left; }
  .btn .arrow { color: var(--green); font-size: 20px; flex: none; }
  .btn.primary { background: var(--green); color: var(--ink); border-color: var(--green); }
  .btn.primary svg { fill: var(--ink); }
  .btn.primary .arrow { color: var(--ink); }
  .btn:hover, .feature:hover { transform: translateY(-2px); border-color: var(--green); box-shadow: 0 0 24px rgba(124, 240, 58, .35); }
  .btn:focus-visible, .feature:focus-visible { outline: 3px solid var(--bone); outline-offset: 3px; }
  .btn.todo { opacity: .45; pointer-events: none; }

  footer { margin-top: 30px; color: rgba(236, 255, 224, .45); font-size: 12px; }
</style>
